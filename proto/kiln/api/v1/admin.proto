message RequestRunnerUpgradeRequest {
  // Runner 名称。
  string runner = 1;
  // 管理员确认的目标版本（可以带 v）：不为空时必须等于 Runner 现在上报的最新版本，否则拒绝（确认之后 Runner 查到了
  // 更新的版本），不会升级到没有确认过的版本。为空时升级到 Runner 上报的最新版本。
  string version = 2;
}

message RequestRunnerUpgradeResponse {
  RunnerUpgradeRequest request = 1;
  // false 表示已有进行中的请求，返回的是那一个。
  bool created = 2;
}

message CancelRunnerUpgradeRequest {
  string runner = 1;
}

message CancelRunnerUpgradeResponse {
  RunnerUpgradeRequest request = 1;
}

message CheckRunnerUpgradeRequest {
  // Runner 名称；为空表示全部没有吊销的 Runner。
  string runner = 1;
}

message CheckRunnerUpgradeResponse {
  // 请求检查的 Runner 数量。
  int32 count = 1;
}

message SyncAIDevRequest {
  // owner/name
  string repo = 1;
}

message SyncAIDevResponse {
  // GitHub 上打开的、有 kiln:ready 的 Issue 数；complete 为假表示太多没有读完（没读到的不移出任务池）。
  int32 listed = 1;
  bool complete = 2;
  // 任务池中有变化（加入、移出、内容变了）的 Issue 数。
  int32 changed = 3;
  // 同步后可选的 Issue 数（有空闲的开发机时开始选题）。
  int32 candidates = 4;
}

message PauseAIDevRequest {
  string repo = 1;
  // true 暂停新的领取（已有的工作项照常收尾），false 恢复。
  bool paused = 2;
}

message PauseAIDevResponse {}

message ListWorkItemsRequest {
  // 为空时列出全部仓库。
  string repo = 1;
  int32 limit = 2;
}

// WorkItem 是一个 AI 开发工作项（PLAN #26.8）。
message WorkItem {
  int64 id = 1;
  string repo = 2;
  string state = 3;
  repeated int32 issues = 4;
  int32 pr_number = 5;
  string branch = 6;
  string head_sha = 7;
  int32 fix_rounds = 8;
  int32 max_fix_rounds = 9;
  string agent = 10;
  string reason = 11;
  int64 created_at = 12;
  int64 updated_at = 13;
  // 交付改动了敏感路径、提交说明有关闭关键字等，PR 加了 kiln:hold（不自动入队）。
  bool hold = 14;
  // 领取之后有 Issue 的标题或正文被修改过。
  bool requirements_changed = 15;
  // 阶段（PLAN #31.3）：design | implement；design_first 表示先设计（有设计阶段）；design_pr 是已合并的设计 PR（没有时为 0）；
  // impl_round 是实现的轮次；round_fixes 是本阶段、本轮因为审计、CI 没有通过的返修轮数，round_conflicts 是冲突返修的轮数
  // （两者分开计，上限都是 max_fix_rounds，PLAN #26.11）。
  string phase = 16;
  bool design_first = 17;
  int32 design_pr = 18;
  int32 impl_round = 19;
  int32 round_fixes = 20;
  int32 round_conflicts = 21;
}

message ListWorkItemsResponse {
  repeated WorkItem items = 1;
  // 只列一个仓库时是它的 AI 开发占用（PLAN #26.9 I14：同一个仓库按工作项串行）；列全部仓库时没有。
  RepoOccupancy occupancy = 2;
}

// RepoOccupancy 是仓库的 AI 开发占用：占用者是未结束的工作项中编号最小的，它合并或终止之后才开始下一项。
message RepoOccupancy {
  // 占用者（没有被占用时为 0）。
  int64 work_item = 1;
  // 不能开始新的工作项的原因（占用者、阶段 / 状态、它在等什么）；没有被占用时为空。
  string reason = 2;
  // 排在占用者之后的未结束的工作项（升级前留下的，按编号）。
  repeated int64 waiting = 3;
}

message StopWorkItemRequest {
  int64 id = 1;
}

message StopWorkItemResponse {}

message RetryWorkItemRequest {
  int64 id = 1;
}

// 返修 job 由仓库的执行者随后规划（与返修相同的路径），不在这里返回。
message RetryWorkItemResponse {
  reserved 1;
  reserved "run_id";
}

// DocBinding 是仓库与外部文档集的绑定（不含 API token）。
message DocBinding {
  // 仓库的 owner/name。
  string repo = 1;
  // 文档提供方，首期只有 outline。
  string provider = 2;
  // 文档系统地址，例如 https://outline.example.com。
  string base_url = 3;
  // 文档集（Outline Collection）的 id 和名称。
  string collection_id = 4;
  string collection_name = 5;
  reserved 6;
  reserved "hook_enabled";
  string updated_by = 7;
  int64 updated_at = 8;
}

message ListDocBindingsRequest {}

message ListDocBindingsResponse {
  repeated DocBinding bindings = 1;
}

message BindDocCollectionRequest {
  string repo = 1;
  string base_url = 2;
  string collection_id = 3;
  string collection_name = 4;
  // Outline API token，由 Server 加密保存；只写不读。
  string token = 5;
}

message BindDocCollectionResponse {
  DocBinding binding = 1;
}

message UnbindDocCollectionRequest {
  string repo = 1;
}

message UnbindDocCollectionResponse {}

// DecisionDoc 是仓库的「待决策清单」配置（不含 token）。
message DecisionDoc {
  // 仓库的 owner/name。
  string repo = 1;
  string provider = 2;
  string base_url = 3;
  // 目标文档的 UUID。
  string doc_id = 4;
  string collection_id = 5;
  // generation 是配置代次，重设（含只轮换 token）时推进。
  int64 generation = 6;
  // has_token 表示已经保存了写 token（token 本身只写不读）。
  bool has_token = 7;
  string updated_by = 8;
  int64 updated_at = 9;
  // observed_units 是最近一次按 UTF-16 code unit 量到的文档篇幅；warning_code 非空表示需要轮转到新文档。
  int64 observed_units = 10;
  int64 observed_at = 11;
  string warning_code = 12;
  int64 warned_at = 13;
  // pending_count / unknown_count 是这个仓库待处理 / 结果不明的条目数量。
  int64 pending_count = 14;
  int64 unknown_count = 15;
}

// DecisionSync 是一条决策同步记录。
message DecisionSync {
  int64 id = 1;
  string repo = 2;
  int64 work_item_id = 3;
  int64 task_id = 4;
  int32 entry_idx = 5;
  // decision 或 blocked。
  string entry_kind = 6;
  // confirmed_decision / acceptance / policy / other（blocked 条目为空）。
  string category = 7;
  // confirmed_decision 是 category 的生成列：改动已确认的决定需要人确认（PR 会加 kiln:hold）。
  bool confirmed_decision = 8;
  // marker 是文档里的精确行内代码标识。
  string marker = 9;
  string target_doc_id = 10;
  // pending / attempted / delivered / unknown / cancelled。
  string state = 11;
  int32 attempts = 12;
  string last_error_code = 13;
  string last_error = 14;
  int64 created_at = 15;
  int64 attempted_at = 16;
  int64 delivered_at = 17;
  string resolved_by = 18;
  string resolution_note = 19;
}

message SetDecisionDocRequest {
  string repo = 1;
  // 文档系统地址；留空时回退到仓库只读绑定的地址。
  string base_url = 2;
  // 目标文档的 UUID。
  string doc_id = 3;
  // 独立、受限的 Outline 写 token，只写不读。
  string token = 4;
}

message SetDecisionDocResponse {
  DecisionDoc decision_doc = 1;
  // 文档轮转（换了 doc_id 或 base_url）时被取消 / 转为 unknown 的旧条目数量。
  int64 cancelled_count = 2;
  int64 unknown_count = 3;
}

message ClearDecisionDocRequest {
  string repo = 1;
}

message ClearDecisionDocResponse {
  int64 cancelled_count = 1;
  int64 unknown_count = 2;
}

message ListDecisionDocsRequest {}

message ListDecisionDocsResponse {
  repeated DecisionDoc decision_docs = 1;
}

message ListDecisionSyncsRequest {
  // 只列出这个仓库的条目；为空时列出全部。
  string repo = 1;
  // 只列出这个状态的条目；为空时列出全部。
  string state = 2;
  int32 limit = 3;
}

message ListDecisionSyncsResponse {
  repeated DecisionSync syncs = 1;
}

message ReconcileDecisionSyncRequest {
  int64 id = 1;
}

message ReconcileDecisionSyncResponse {
  DecisionSync sync = 1;
  // found 表示文档里找到了精确 marker（条目已转为 delivered）。
  bool found = 2;
}

message ResolveDecisionSyncRequest {
  int64 id = 1;
  // delivered 或 cancelled。
  string state = 2;
  // 人工结案的原因（必填）。
  string note = 3;
}

message ResolveDecisionSyncResponse {
  DecisionSync sync = 1;
}
