syntax = "proto3";

package kiln.api.v1;

// AdminService 供 kiln CLI 使用（Dashboard 目前由 Server 直接渲染页面）。
// 认证：Authorization: Bearer <KILN_ADMIN_TOKEN>。管理员绑定了 GitHub 账号后，CLI 的操作在审计日志中记为该账号。
service AdminService {
  // GetAdminBinding 返回管理员绑定的 GitHub 账号，以及 Dashboard 是否允许用 admin token 登录。
  rpc GetAdminBinding(GetAdminBindingRequest) returns (GetAdminBindingResponse);
  // SetTokenLogin 开启或关闭 Dashboard 的 admin token 登录；关闭前必须先绑定 GitHub 账号。CLI 不受影响。
  rpc SetTokenLogin(SetTokenLoginRequest) returns (SetTokenLoginResponse);
  // UnbindAdmin 解除管理员绑定的 GitHub 账号，同时恢复 Dashboard 的 admin token 登录。
  rpc UnbindAdmin(UnbindAdminRequest) returns (UnbindAdminResponse);

  rpc CreateEnrollToken(CreateEnrollTokenRequest) returns (CreateEnrollTokenResponse);
  // ListRunners 返回 CI Runner（kiln-runner）；AI Runner 见 ListAIRunners（PLAN #30.9）。
  rpc ListRunners(ListRunnersRequest) returns (ListRunnersResponse);
  rpc ListAIRunners(ListAIRunnersRequest) returns (ListAIRunnersResponse);
  rpc RevokeRunner(RevokeRunnerRequest) returns (RevokeRunnerResponse);
  // DeleteRunner 删除已吊销、没有未结束任务的 Runner：从列表中移除，名称可以重新注册；它的尝试记录保留并记下名称。
  rpc DeleteRunner(DeleteRunnerRequest) returns (DeleteRunnerResponse);
  rpc DrainRunner(DrainRunnerRequest) returns (DrainRunnerResponse);
  // GetRunnerCache 返回 Runner 最近一次上报的缓存清单、上一次清理的结果和清理请求（PLAN #8.3）。
  rpc GetRunnerCache(GetRunnerCacheRequest) returns (GetRunnerCacheResponse);
  // PurgeRunnerCache 预览（dry_run）或发起一次缓存清理：Runner 在没有正在执行的 job 时执行。
  rpc PurgeRunnerCache(PurgeRunnerCacheRequest) returns (PurgeRunnerCacheResponse);

  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  // SyncInstallations 刷新仓库目录：列出 App 的 installation 和仓库（不读取分支、tag、PR）。只在用户显式操作时调用。
  rpc SyncInstallations(SyncInstallationsRequest) returns (SyncInstallationsResponse);
  // ReconcileRepo 对一个仓库补对账：比较它的分支、tag 和打开的 PR，补上漏掉的 webhook（PLAN #7.3）。
  rpc ReconcileRepo(ReconcileRepoRequest) returns (ReconcileRepoResponse);
  rpc BumpCacheSalt(BumpCacheSaltRequest) returns (BumpCacheSaltResponse);

  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc CancelRun(CancelRunRequest) returns (CancelRunResponse);
  rpc RerunRun(RerunRunRequest) returns (RerunRunResponse);
  rpc RerunJob(RerunJobRequest) returns (RerunJobResponse);
  rpc Dispatch(DispatchRequest) returns (DispatchResponse);
  // TriggerAIReview 手动触发一次 AI 审计：审计指定的 commit（ref 或 sha），仓库需要有 .kiln/agent/config.yml。
  rpc TriggerAIReview(TriggerAIReviewRequest) returns (TriggerAIReviewResponse);
  // AI 请求（审计、开发，PLAN #30.9）：列出、详情（含各平台任务）、取消、重跑审计请求、读取任务的日志。
  rpc ListAIRequests(ListAIRequestsRequest) returns (ListAIRequestsResponse);
  rpc GetAIRequest(GetAIRequestRequest) returns (GetAIRequestResponse);
  rpc CancelAIRequest(CancelAIRequestRequest) returns (CancelAIRequestResponse);
  rpc RerunAIRequest(RerunAIRequestRequest) returns (RerunAIRequestResponse);
  rpc GetAITaskLog(GetAITaskLogRequest) returns (GetAITaskLogResponse);
  // AI 开发（PLAN #26.11）：从 GitHub 全量同步任务池、暂停 / 恢复仓库的新领取、列出工作项、终止或重试一个工作项。
  rpc SyncAIDev(SyncAIDevRequest) returns (SyncAIDevResponse);
  rpc PauseAIDev(PauseAIDevRequest) returns (PauseAIDevResponse);
  rpc ListWorkItems(ListWorkItemsRequest) returns (ListWorkItemsResponse);
  rpc StopWorkItem(StopWorkItemRequest) returns (StopWorkItemResponse);
  rpc RetryWorkItem(RetryWorkItemRequest) returns (RetryWorkItemResponse);
  rpc GetJobLog(GetJobLogRequest) returns (GetJobLogResponse);

  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc SetVariable(SetVariableRequest) returns (SetVariableResponse);
  rpc DeleteVariable(DeleteVariableRequest) returns (DeleteVariableResponse);
  rpc ListVariables(ListVariablesRequest) returns (ListVariablesResponse);
  rpc UpsertEnvironment(UpsertEnvironmentRequest) returns (UpsertEnvironmentResponse);
  rpc DeleteEnvironment(DeleteEnvironmentRequest) returns (DeleteEnvironmentResponse);
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
  // 账号级 npm 配置（PLAN #27.2）：release.npm 发布到 @<scope>/<name>，token 只写不读。
  rpc SetNpmAccount(SetNpmAccountRequest) returns (SetNpmAccountResponse);
  rpc DeleteNpmAccount(DeleteNpmAccountRequest) returns (DeleteNpmAccountResponse);
  rpc ListNpmAccounts(ListNpmAccountsRequest) returns (ListNpmAccountsResponse);

  // 外部设计文档绑定：把仓库关联到第三方文档集（首期 Outline），API token 只写不读、由 Server 加密保存。
  rpc ListDocBindings(ListDocBindingsRequest) returns (ListDocBindingsResponse);
  rpc BindDocCollection(BindDocCollectionRequest) returns (BindDocCollectionResponse);
  rpc UnbindDocCollection(UnbindDocCollectionRequest) returns (UnbindDocCollectionResponse);

  // 待决策清单：AI 开发的决策疑难点单向同步到一篇独立的 Outline 文档。
  rpc SetDecisionDoc(SetDecisionDocRequest) returns (SetDecisionDocResponse);
  rpc ClearDecisionDoc(ClearDecisionDocRequest) returns (ClearDecisionDocResponse);
  rpc ListDecisionDocs(ListDecisionDocsRequest) returns (ListDecisionDocsResponse);
  rpc ListDecisionSyncs(ListDecisionSyncsRequest) returns (ListDecisionSyncsResponse);
  // ReconcileDecisionSync 对 unknown / attempted 的条目做一次只读查证，绝不重写文档。
  rpc ReconcileDecisionSync(ReconcileDecisionSyncRequest) returns (ReconcileDecisionSyncResponse);
  // ResolveDecisionSync 人工把 unknown 的条目结案为 delivered / cancelled，必须写明原因。
  rpc ResolveDecisionSync(ResolveDecisionSyncRequest) returns (ResolveDecisionSyncResponse);

  // 合并队列（PLAN #28）：入队和移除等同于给 PR 加上、去掉 label kiln:merge。
  rpc ListMergeQueue(ListMergeQueueRequest) returns (ListMergeQueueResponse);
  rpc AddToMergeQueue(AddToMergeQueueRequest) returns (AddToMergeQueueResponse);
  rpc RemoveFromMergeQueue(RemoveFromMergeQueueRequest) returns (RemoveFromMergeQueueResponse);

  // 自动打 tag（PLAN #29.4）：合并进默认分支的 commit 打 tag 的记录；失败或跳过的可以重试。
  rpc ListAutoTags(ListAutoTagsRequest) returns (ListAutoTagsResponse);
  rpc RetryAutoTag(RetryAutoTagRequest) returns (RetryAutoTagResponse);

  // Runner 自升级（PLAN #27.13）：管理员按台请求升级到 Runner 上报的最新版本。
  rpc GetRunnerUpgrade(GetRunnerUpgradeRequest) returns (GetRunnerUpgradeResponse);
  // SetRunnerUpgradeRegistry 设置 Runner 查询和下载升级包用的 registry（空表示官方 registry）。
  rpc SetRunnerUpgradeRegistry(SetRunnerUpgradeRegistryRequest) returns (SetRunnerUpgradeRegistryResponse);
  // RequestRunnerUpgrade 请求把一台 Runner 升级到它上报的最新版本；已有进行中的请求时返回那一个。
  rpc RequestRunnerUpgrade(RequestRunnerUpgradeRequest) returns (RequestRunnerUpgradeResponse);
  // CancelRunnerUpgrade 取消一台 Runner 进行中（还没有切换）的升级请求。
  rpc CancelRunnerUpgrade(CancelRunnerUpgradeRequest) returns (CancelRunnerUpgradeResponse);
  // CheckRunnerUpgrade 让 Runner 立即查询最新版本（runner 为空表示全部没有吊销的 Runner）。
  rpc CheckRunnerUpgrade(CheckRunnerUpgradeRequest) returns (CheckRunnerUpgradeResponse);

  rpc ListOutbox(ListOutboxRequest) returns (ListOutboxResponse);
  rpc RetryOutbox(RetryOutboxRequest) returns (RetryOutboxResponse);
}

message CreateEnrollTokenRequest {
  string pool = 1;
  int32 ttl_minutes = 2;
  // 注册的 Runner 类型：ci（默认，kiln-runner）或 ai（kiln-orca）。
  string kind = 3;
  // AI Runner 的角色：review（默认，审计）或 development（开发）；CI Runner 不能设置（PLAN #26.7）。
  string role = 4;
}

message CreateEnrollTokenResponse {
  string token = 1;
  int64 expires_at = 2;
}

message Runner {
  int64 id = 1;
  string name = 2;
  string pool = 3;
  repeated string platforms = 4;
  repeated string executors = 5;
  string version = 6;
  string state = 7;
  int64 last_seen_at = 8;
  int32 running_jobs = 9;
  map<string, string> host_fingerprint = 10;
  // 静态规格与容量（PLAN #8.6）；旧版 Runner 没有上报时为空。
  RunnerCapacity capacity = 11;
  // 本地缓存的总大小和最近一次上报的时间（Unix 秒，0 表示没有上报过）。
  int64 cache_bytes = 12;
  int64 cache_reported_at = 13;
  // 总是 ci（AI Runner 见 AIRunner）。
  string kind = 14;
  // 自升级（PLAN #27.6）。
  RunnerUpgradeInfo upgrade = 15;
  // AI 的字段移到 AIRunner（PLAN #30.9）。
  reserved 16, 17, 18;
  reserved "role", "ai_protocol", "agents";
}

// AIRunner 是一个 AI 执行节点（执行机器上的 Orca Server + kiln-orca 连接器，PLAN #33）。
message AIRunner {
  int64 id = 1;
  string name = 2;
  // review（审计）或 development（开发）。
  string role = 3;
  // 连接器（kiln-orca）的版本。
  string version = 4;
  // 显示状态：active、draining、offline、revoked（与 Runner.state 相同）。
  string state = 5;
  int64 last_seen_at = 6;
  string platform = 7;
  // 上报的 AI 协议版本；needs_upgrade 表示不是 Server 支持的版本（不派任务）。
  int32 protocol = 8;
  bool needs_upgrade = 9;
  // 机器标识（展示用，不参与调度）。
  string host_id = 10;
  // Herdr 已经退役（PLAN #33.6）：原来的 11、12 号字段保留给 Orca 的状态。
  reserved 11, 12;
  reserved "herdr_state", "herdr_reason";
  string docker_state = 13;
  string docker_reason = 14;
  // 执行中的任务数。
  int32 running = 15;
  repeated AIRunnerAgent agents = 16;
  // 按台升级已经去掉（连接器用 npm 升级，PLAN #33.3）。
  reserved 17;
  reserved "upgrade";
  // 同时执行的任务数上限（连接器配置 max_tasks）；running >= capacity 时不派任务。
  int32 capacity = 18;
  // Orca Server 的就绪状态（ready、unavailable、unknown）和原因，以及它的版本和 runtime id。
  string orca_state = 19;
  string orca_reason = 20;
  string orca_version = 21;
  string orca_runtime_id = 22;
}

// AIRunnerAgent 是 AI Runner 上的一个 Agent（Runner 配置为提供的）。
message AIRunnerAgent {
  // Agent ID（codex、claude-code）和显示名。
  string agent = 1;
  string name = 2;
  string version = 3;
  // 显示状态：available、unavailable、not_installed、unknown 等（ai.AgentShow*）。
  string state = 4;
  string reason = 5;
  int64 checked_at = 6;
  int64 backoff_until = 7;
}

message ListAIRunnersRequest {}

message ListAIRunnersResponse {
  repeated AIRunner runners = 1;
}

// AIRequest 是一个 AI 请求（一次审计或一次开发执行）。
message AIRequest {
  int64 id = 1;
  // review 或 develop。
  string type = 2;
  string repo = 3;
  string event = 4;
  string ref = 5;
  string sha = 6;
  string trigger = 7;
  string sender = 8;
  // queued | active | succeeded | failed | cancelled | skipped
  string state = 9;
  // 审计的 PR；没有时为 0。
  int32 pr_number = 10;
  // 重跑的是哪个请求；首次请求为 0。
  int64 rerun_of = 11;
  int64 created_at = 12;
  int64 finished_at = 13;
  string config_error = 14;
}

// AITask 是 AI 请求在一个平台上的一次执行。
message AITask {
  int64 id = 1;
  int64 request_id = 2;
  string key = 3;
  string display_name = 4;
  // 当前 attempt 实际执行的平台（领取时节点上报的，例如 linux/amd64）；还没有领取时为空。
  string platform = 5;
  string agent = 6;
  // waiting | pending | running | succeeded | failed | timed_out | cancelled | skipped
  string state = 7;
  string reason = 8;
  // 沿用的结果来源任务；没有时为 0。
  int64 reused_from = 9;
  int32 attempt_count = 10;
  // 当前 attempt 的 Runner（没有时为空）。
  string runner = 11;
  int64 started_at = 12;
  int64 finished_at = 13;
  // 当前 attempt 在 Orca 中的执行关联（PLAN #33.4）；任务还没有 attempt 时为空。
  AIOrca orca = 14;
  // 当前 attempt 的进度：连接器心跳上报的阶段（prepare、start、running、finishing）和说明。
  string stage = 15;
  string text = 16;
  // 可以执行这个任务的平台（Runner 平台，至少一个）：一组平台时组内任一平台的节点都可以领取（PLAN #26.1）。
  repeated string platforms = 17;
}

// AIOrca 是 AI 任务的一次执行在 Orca 中的关联（PLAN #33.4）：用于恢复、取消和从 Dashboard 定位。
message AIOrca {
  string runtime_id = 1;
  string run_id = 2;
  string task_id = 3;
  string dispatch_id = 4;
  string worktree_name = 5;
  string worktree_path = 6;
}

message ListAIRequestsRequest {
  // owner/name；为空表示全部仓库。
  string repo = 1;
  // review、develop；为空表示全部。
  string type = 2;
  int32 pr_number = 3;
  string state = 4;
  int32 limit = 5;
}

message ListAIRequestsResponse {
  repeated AIRequest requests = 1;
}

message GetAIRequestRequest {
  int64 id = 1;
}

message GetAIRequestResponse {
  AIRequest request = 1;
  repeated AITask tasks = 2;
}

message CancelAIRequestRequest {
  int64 id = 1;
}

message CancelAIRequestResponse {}

message RerunAIRequestRequest {
  int64 id = 1;
  // all、failed（默认）或 task（只重跑 task_id）。
  string mode = 2;
  int64 task_id = 3;
}

message RerunAIRequestResponse {
  // 新的请求。
  int64 id = 1;
}

message GetAITaskLogRequest {
  int64 task_id = 1;
  // 0 表示当前的 attempt。
  int64 attempt_id = 2;
  int64 offset = 3;
}

message GetAITaskLogResponse {
  bytes data = 1;
  int64 next_offset = 2;
  bool finished = 3;
}

// RunnerUpgradeInfo 是一台 Runner 的自升级状态（PLAN #27.12–#27.14）。
message RunnerUpgradeInfo {
  // Runner 上报的状态（idle、downloading、ready、draining、switching、confirmed、failed、rolled_back、manual）；
  // 空表示 Runner 没有上报过（版本不支持自升级）。
  string state = 1;
  string target = 2;
  string error = 3;
  // 经过启动器运行（能切换版本）。
  bool launcher = 4;
  reserved 5, 6, 7;
  reserved "pin", "below_min_version", "assigned";
  string current = 8;
  string previous = 9;
  // config.toml 中 upgrade = false。
  bool disabled = 10;
  // 对应的 npm 包、registry 中的最新正式版本、最后一次检查成功的时间（Unix 秒）和最后一次检查的错误。
  string package = 11;
  string latest = 12;
  int64 checked_at = 13;
  string check_error = 14;
  // 已经请求检查、Runner 还没有处理。
  bool check_pending = 15;
  // 最近一次升级请求（进行中或已结束）；没有时不设置。
  RunnerUpgradeRequest request = 16;
  // 现在能否请求升级到 latest；不能时 reason 说明原因（已是最新、需要 service install 等）。
  bool can_upgrade = 17;
  string reason = 18;
}

// RunnerUpgradeRequest 是一次按台升级的请求。
message RunnerUpgradeRequest {
  int64 id = 1;
  // 目标版本和请求时 Runner 的版本（不带 v）。
  string version = 2;
  string from_version = 3;
  // pending | succeeded | failed | cancelled
  string state = 4;
  string error = 5;
  string actor = 6;
  int64 created_at = 7;
  // 结束的时间（Unix 秒，0 表示还没有结束）。
  int64 finished_at = 8;
}

message ResourceAmount {
  double cpu = 1;
  int64 memory_bytes = 2;
}

message RunnerCapacity {
  // 机器规格（逻辑 CPU 核数、物理内存）。
  ResourceAmount machine = 1;
  // config.toml 中为宿主机预留的资源。
  ResourceAmount reserved = 2;
  // 各 executor 的固定上限（host：服务的 cgroup 限制；oci：docker 的规格），字段为 0 表示不限制。
  map<string, ResourceAmount> executor_limits = 3;
  int32 max_jobs = 4;
  // 可以分配给 job 的总量（machine - reserved）。
  ResourceAmount allocatable = 5;
  // 正在执行的 job 声明的资源之和。
  ResourceAmount allocated = 6;
}

message RunnerCacheEntry {
  // toolcache | runtime | git | cas | buildkit | work | image | legacy
  string kind = 1;
  int64 repo_id = 2;
  // 所属仓库（owner/name），Kiln 中没有这个仓库时为空。
  string repo = 3;
  string platform = 4;
  string domain = 5;
  string name = 6;
  string path = 7;
  int64 size_bytes = 8;
  int64 last_used_at = 9;
  // 按保留策略到期的时间，0 表示没有（CAS 对象各自到期）。
  int64 expires_at = 10;
}

message RunnerCacheFailure {
  string kind = 1;
  string path = 2;
  string error = 3;
}

message RunnerCachePurge {
  int64 id = 1;
  string repo = 2;
  repeated string kinds = 3;
  string domain = 4;
  // pending | done
  string state = 5;
  string actor = 6;
  int64 created_at = 7;
  int64 done_at = 8;
  int64 removed = 9;
  int64 removed_bytes = 10;
  repeated RunnerCacheFailure failures = 11;
}

message GetRunnerCacheRequest {
  string name = 1;
}

message GetRunnerCacheResponse {
  // 清单生成的时间（Unix 秒），0 表示 Runner 还没有上报过（旧版 Runner 或刚注册）。
  int64 generated_at = 1;
  repeated RunnerCacheEntry entries = 2;
  int64 disk_total_bytes = 3;
  int64 disk_free_bytes = 4;
  // 上一次清理（GC 或清理请求）。
  int64 gc_at = 5;
  int64 gc_removed = 6;
  int64 gc_removed_bytes = 7;
  repeated RunnerCacheFailure gc_failures = 8;
  // 最近的清理请求（新的在前）。
  repeated RunnerCachePurge purges = 9;
}

message PurgeRunnerCacheRequest {
  string name = 1;
  // 只清理这个仓库（owner/name）的 toolcache、git 镜像和工作区；为空表示不限仓库。
  string repo = 2;
  // 类别（toolcache、runtime、git、cas、buildkit、work、image、legacy），为空表示全部。
  repeated string kinds = 3;
  // toolcache 的执行身份（host、oci-root…），为空表示全部。
  string domain = 4;
  // 只预览，不发起清理。
  bool dry_run = 5;
}

message PurgeRunnerCacheResponse {
  // 按最近一次上报的清单，范围内会删除的项和总大小。
  repeated RunnerCacheEntry matched = 1;
  int64 matched_bytes = 2;
  // 不在范围内、继续保留的共享缓存（不属于单个仓库：runtime、CAS、镜像等），按各自的到期时间清理。
  repeated RunnerCacheEntry retained_shared = 3;
  // 发起的清理请求（dry_run 时为 0）。
  int64 purge_id = 4;
  // 说明：Runner 正在执行的 job 数（清理会等它们结束）、清单的时间等。
  repeated string notes = 5;
}

message ListRunnersRequest {}

message ListRunnersResponse {
  repeated Runner runners = 1;
}

message RevokeRunnerRequest {
  string name = 1;
}

message RevokeRunnerResponse {}

message DeleteRunnerRequest {
  string name = 1;
}

message DeleteRunnerResponse {}

message DrainRunnerRequest {
  string name = 1;
  // false 表示取消 drain。
  bool drain = 2;
}

message DrainRunnerResponse {}

message Repo {
  int64 id = 1;
  string full_name = 2;
  int64 installation_id = 3;
  bool private = 4;
  string default_branch = 5;
  bool active = 6;
}

message ListReposRequest {}

message ListReposResponse {
  repeated Repo repos = 1;
}

message SyncInstallationsRequest {}

message SyncInstallationsResponse {
  int32 installations = 1;
  int32 repos = 2;
}

message ReconcileRepoRequest {
  // owner/name
  string repo = 1;
}

message ReconcileRepoResponse {
  string repo = 1;
  // 第一次对账：没有记录过的 ref 只记录为基线，不触发构建。
  bool baseline = 2;
  int32 branches = 3;
  int32 tags = 4;
  int32 pulls = 5;
  // 补上的 run 数。
  int32 runs = 6;
}

message BumpCacheSaltRequest {
  string repo = 1;
}

message BumpCacheSaltResponse {}

message Run {
  int64 id = 1;
  string repo = 2;
  string workflow = 3;
  string event = 4;
  string ref = 5;
  string sha = 6;
  string state = 7;
  int32 rerun = 8;
  int64 created_at = 9;
  string source = 10;
  string error = 11;
}

message Job {
  int64 id = 1;
  string job_key = 2;
  string display_name = 3;
  string state = 4;
  string kind = 5;
  string platform = 6;
  string executor = 7;
  int64 cached_from_job_id = 8;
  string runner = 9;
  int32 attempts = 10;
  string reason = 11;
  string action_key = 12;
  int64 started_at = 13;
  int64 finished_at = 14;
  int32 rerun = 15;
  // 排队中的 job 没有被领取的原因（调度器最近一次跳过它的原因，例如资源不够时需要多少、各 Runner 能提供多少）。
  string wait_reason = 16;
}

message ListRunsRequest {
  string repo = 1;
  int32 limit = 2;
}

message ListRunsResponse {
  repeated Run runs = 1;
}

message GetRunRequest {
  int64 id = 1;
}

message GetRunResponse {
  Run run = 1;
  repeated Job jobs = 2;
}

message CancelRunRequest {
  int64 id = 1;
}

message CancelRunResponse {}

message RerunRunRequest {
  int64 id = 1;
  // failed（默认）| all | all_no_cache
  string mode = 2;
}

