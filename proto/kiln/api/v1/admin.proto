message TriggerAIReviewRequest {
  // owner/name
  string repo = 1;
  // 分支名、refs/heads/x 或 commit sha；为空时用默认分支。
  string ref = 2;
  // 幂等键：同一个 request_id 只创建一个 AI 审计请求。
  string request_id = 3;
}

message TriggerAIReviewResponse {
  reserved 1;
  reserved "run_id";
  string sha = 2;
  // AI 审计请求的 ID（PLAN #30.4）。
  int64 ai_request_id = 3;
}

// MergeQueueEntry 是合并队列中的一项（PR 的一次入队）。
message MergeQueueEntry {
  int64 id = 1;
  int32 pr = 2;
  // queued | merged | removed
  string state = 3;
  string head_sha = 4;
  string enqueued_by = 5;
  // 当前在等什么（排队中时）。
  string status = 6;
  // 出队原因，或者"在队列之外被合并"。
  string reason = 7;
  string merge_sha = 8;
  int64 enqueued_at = 9;
  int64 finished_at = 10;
  // 自动出队的类别（PLAN #28.3）：conflict_dev（与目标分支冲突，已交给 AI 开发返修）、conflict_author（冲突，等待提交者
  // 或人解决）；其他出队为空。
  string removal = 11;
  // PR 最近观测到的目标分支（PLAN #28.5）：合并队列按目标分支分别排队。旧记录为空。
  string base_ref = 12;
}

message ListMergeQueueRequest {
  // owner/name
  string repo = 1;
}

message ListMergeQueueResponse {
  // 排队中的项，第一个是队首。
  repeated MergeQueueEntry queued = 1;
  // 最近结束（合并或出队）的项，新的在前。
  repeated MergeQueueEntry recent = 2;
}

message AddToMergeQueueRequest {
  string repo = 1;
  int32 pr = 2;
}

message AddToMergeQueueResponse {
  // 为 false 表示 PR 已经在队列中。
  bool added = 1;
}

message RemoveFromMergeQueueRequest {
  string repo = 1;
  int32 pr = 2;
}

message RemoveFromMergeQueueResponse {}

// AutoTag 是一个合并进默认分支的 commit 的自动打 tag 记录。
message AutoTag {
  int64 id = 1;
  string sha = 2;
  int32 pr = 3;
  repeated string labels = 4;
  string merged_by = 5;
  // queue | webhook
  string source = 6;
  // pending | tagging | tagged | planned | skipped | failed
  string state = 7;
  string tag = 8;
  string reason = 9;
  int32 tries = 10;
  int64 created_at = 11;
  int64 updated_at = 12;
  // 认定的 AI 开发工作项（审计关联；没有可信归属时为 0）。
  int64 work_item_id = 13;
  // 真实的发布发起者是否是机器人。
  bool sender_is_bot = 14;
  // PR 的目标分支（PLAN #29.4）：只有合入发版分支的才会打 tag。旧记录为空。
  string base_ref = 15;
}

message ListAutoTagsRequest {
  string repo = 1;
  // 最多返回的条数，0 表示默认（50）。
  int32 limit = 2;
}

message ListAutoTagsResponse {
  // 新的在前。
  repeated AutoTag tags = 1;
}

message RetryAutoTagRequest {
  string repo = 1;
  // commit sha（完整）。
  string sha = 2;
}

message RetryAutoTagResponse {}

message GetRunnerUpgradeRequest {}

